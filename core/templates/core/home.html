{% extends 'core/base.html' %}
{% load static %}
{% block content %}
<div class="hero">
    <img src="{% static 'core/images/coffee.png' %}" alt="Kofe">
    <h1>OurCafe'ga xush kelibsiz!</h1>
</div>
<p>Menyuda {{ menu_count }} ta taom, {{ table_count }} ta stol mavjud.</p>
<h2>Mashhur taomlar</h2>
{% for item in latest_items %}
<div class="card">
    <a href="{% url 'menu_detail' item.pk %}"><b>{{ item.name }}</b></a>
    <span class="price">{{ item.price }} so'm</span>
</div>
{% endfor %}
<a class="btn" href="{% url 'menu_list' %}">Butun menyu</a>
{% endblock %}
